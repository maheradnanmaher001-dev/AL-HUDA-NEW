name: Build AL-HUDA Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          FOUND=$(find . -maxdepth 1 -iname "*.zip" | head -n 1 || true)
          if [ -z "$FOUND" ]; then
            echo "No .zip file found in the repo root." >&2
            exit 1
          fi
          echo "Found ZIP: $FOUND"
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.zip.outputs.path }}"
          TMP_DIR=".zip_extract_tmp"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          unzip -q "$ZIP_PATH" -d "$TMP_DIR"

          # The zip contains one top-level folder (al_huda_flutter/) — flatten
          # its contents up to the repo root so pubspec.yaml ends up at ./pubspec.yaml
          SRC_DIR="$TMP_DIR"
          ENTRY_COUNT=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRY_COUNT" -eq 1 ] && [ -d "$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)" ]; then
            SRC_DIR=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)
          fi

          shopt -s dotglob nullglob
          cp -Rf "$SRC_DIR"/* .
          rm -rf "$TMP_DIR"

          test -f pubspec.yaml
          echo "PASS: project files extracted to repo root."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android platform files
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.alhuda .
          fi

      - name: Set proper app display name (AL-HUDA)
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="AL-HUDA"/' "$MANIFEST"
          grep -q 'android:label="AL-HUDA"' "$MANIFEST"
          echo "PASS: app label set to AL-HUDA"

      - name: Add location permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <application/' "$MANIFEST"
          fi
          grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"
          echo "PASS: location permissions present"

      - name: Bump compileSdk/targetSdk (required by geocoding/geolocator)
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_PROPS="android/local.properties"
          test -f "$LOCAL_PROPS"
          # This is the officially supported way to override the SDK level
          # used by EVERY module in the build — including plugin subprojects
          # like geocoding_android and geolocator_android, not just :app.
          sed -i '/^flutter.compileSdkVersion=/d;/^flutter.targetSdkVersion=/d' "$LOCAL_PROPS"
          {
            echo "flutter.compileSdkVersion=36"
            echo "flutter.targetSdkVersion=36"
          } >> "$LOCAL_PROPS"
          grep -q 'flutter.compileSdkVersion=36' "$LOCAL_PROPS"
          echo "PASS: global compileSdk/targetSdk set to 36 via local.properties"

          # Belt-and-suspenders: also hardcode it in :app's own build.gradle
          # in case local.properties is ever ignored for that module.
          GRADLE_KTS="android/app/build.gradle.kts"
          GRADLE_GROOVY="android/app/build.gradle"
          if [ -f "$GRADLE_KTS" ]; then
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$GRADLE_KTS"
            sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/' "$GRADLE_KTS"
          elif [ -f "$GRADLE_GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$GRADLE_GROOVY"
            sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/' "$GRADLE_GROOVY"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AL-HUDA build #${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true

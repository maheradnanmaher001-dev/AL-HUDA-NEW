name: Build AL-HUDA Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          FOUND=$(find . -maxdepth 1 -iname "*.zip" | head -n 1 || true)
          if [ -z "$FOUND" ]; then
            echo "No .zip file found in the repo root." >&2
            exit 1
          fi
          echo "Found ZIP: $FOUND"
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.zip.outputs.path }}"
          TMP_DIR=".zip_extract_tmp"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          unzip -q "$ZIP_PATH" -d "$TMP_DIR"

          # The zip contains one top-level folder (al_huda_flutter/) — flatten
          # its contents up to the repo root so pubspec.yaml ends up at ./pubspec.yaml
          SRC_DIR="$TMP_DIR"
          ENTRY_COUNT=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRY_COUNT" -eq 1 ] && [ -d "$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)" ]; then
            SRC_DIR=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)
          fi

          shopt -s dotglob nullglob
          cp -Rf "$SRC_DIR"/* .
          rm -rf "$TMP_DIR"

          test -f pubspec.yaml
          echo "PASS: project files extracted to repo root."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android platform files
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.alhuda .
          fi

      - name: Use a fixed debug keystore (so updates install without uninstalling)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          cp android_keystore/debug.keystore ~/.android/debug.keystore
          echo "PASS: fixed debug keystore installed — every build will share the same signature."

      - name: Set proper app display name (AL-HUDA)
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="AL-HUDA"/' "$MANIFEST"
          grep -q 'android:label="AL-HUDA"' "$MANIFEST"
          echo "PASS: app label set to AL-HUDA"

      - name: Add location permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          if ! grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <application/' "$MANIFEST"
          fi
          grep -q 'ACCESS_FINE_LOCATION' "$MANIFEST"
          echo "PASS: location permissions present"

      - name: Install custom app icon
        shell: bash
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp "icon_source/mipmap-${density}_ic_launcher.png" "$RES/mipmap-$density/ic_launcher.png"
          done
          # Remove the adaptive-icon override (if the template generated one) —
          # on Android 8+, mipmap-anydpi-v26/ic_launcher.xml takes priority
          # over the plain ic_launcher.png files above and would otherwise
          # keep showing Flutter's default logo instead of ours.
          rm -rf "$RES/mipmap-anydpi-v26"
          echo "PASS: custom app icon installed for all densities"

      - name: Install custom splash screen
        shell: bash
        run: |
          set -euo pipefail
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/drawable-v21"
          cp icon_source/splash_bg.png "$RES/drawable/splash_bg.png"
          cp icon_source/splash_bg.png "$RES/drawable-v21/splash_bg.png"

          cat > "$RES/drawable/launch_background.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
              <item android:gravity="center">
                  <bitmap android:gravity="center" android:src="@drawable/splash_bg" />
              </item>
          </layer-list>
          XMLEOF
          cp "$RES/drawable/launch_background.xml" "$RES/drawable-v21/launch_background.xml"

          # Android 12+ splash screen API, if the template generated it —
          # branded background color; safe to skip if the file isn't present.
          V31_STYLES="$RES/values-v31/styles.xml"
          if [ -f "$V31_STYLES" ]; then
            sed -i 's/name="android:windowSplashScreenBackground">[^<]*</name="android:windowSplashScreenBackground">#FBF6EC</' "$V31_STYLES"
          fi
          echo "PASS: custom splash screen installed"

      - name: Get dependencies
        run: flutter pub get

      - name: Force compileSdk/targetSdk 36 for app + every plugin
        shell: bash
        run: python3 tools/fix_compilesdk.py

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AL-HUDA build #${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true

name: Build AL-HUDA Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          FOUND=$(find . -maxdepth 1 -iname "*.zip" | head -n 1 || true)
          if [ -z "$FOUND" ]; then
            echo "No .zip file found in the repo root." >&2
            exit 1
          fi
          echo "Found ZIP: $FOUND"
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="${{ steps.zip.outputs.path }}"
          TMP_DIR=".zip_extract_tmp"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          unzip -q "$ZIP_PATH" -d "$TMP_DIR"

          # The zip contains one top-level folder (al_huda_flutter/) — flatten
          # its contents up to the repo root so pubspec.yaml ends up at ./pubspec.yaml
          SRC_DIR="$TMP_DIR"
          ENTRY_COUNT=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$ENTRY_COUNT" -eq 1 ] && [ -d "$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)" ]; then
            SRC_DIR=$(find "$TMP_DIR" -mindepth 1 -maxdepth 1)
          fi

          shopt -s dotglob nullglob
          cp -Rf "$SRC_DIR"/* .
          rm -rf "$TMP_DIR"

          test -f pubspec.yaml
          echo "PASS: project files extracted to repo root."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android platform files
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.alhuda .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK_PATH"
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AL-HUDA build #${{ github.run_number }}
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
